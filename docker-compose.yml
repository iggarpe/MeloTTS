version: '3.8'

services:
  melotts-api:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "8000:8000"
    environment:
      - API_TOKEN=${API_TOKEN:-your-secure-api-token-here}
      - HOST=0.0.0.0
      - PORT=8000
      - ENABLE_DOCS=true
      - ALLOWED_ORIGINS=*
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Optional: Nginx reverse proxy for additional security
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - melotts-api
    restart: unless-stopped
    profiles:
      - production 